apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: zylos-identity
data:
  02-test-users.yaml: |
    realm: zylos
    users:
      - username: alice
        enabled: true
        emailVerified: true
        firstName: Alice
        lastName: Customer
        email: alice@zylos.example
        credentials:
          - type: password
            value: "AliceDevPw_2026!"
