apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-postgres
  namespace: zylos-identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: zylos-platform
    app.kubernetes.io/component: identity-database
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-db-credentials
      encoding: UTF8

  storage:
    size: 50Gi

  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  monitoring:
    enablePodMonitor: true
