apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zylos-edge-gateway
  namespace: zylos-infra-gateway
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: zylos-infra-gateway

    - name: https-wildcard
      port: 443
      protocol: HTTPS
      hostname: "*.zylos.app"
      tls:
        mode: Terminate
        certificateRefs:
          - name: zylos-wildcard-tls-cert
      allowedRoutes:
        namespaces:
          from: All
