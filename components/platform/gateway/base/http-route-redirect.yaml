apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edge-http-redirect
  namespace: zylos-infra-gateway
spec:
  parentRefs:
    - name: zylos-edge-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
