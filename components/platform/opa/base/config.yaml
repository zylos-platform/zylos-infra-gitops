apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  namespace: opa
  labels:
    app.kubernetes.io/name: opa
    app.kubernetes.io/component: policy-engine
    app.kubernetes.io/part-of: zylos-core-infrastructure
data:
  config.yaml: |
    services:
      ghcr:
        url: https://ghcr.io
        type: oci
        credentials:
          bearer:
            token: "${GHCR_TOKEN}"

    bundles:
      zylos-policies:
        service: ghcr
        resource: ghcr.io/zylos-platform/policies:main
        persist: true
        polling:
          min_delay_seconds: 20
          max_delay_seconds: 60

    persistence_directory: /var/opa

    status:
      console: true

    # Dev-grade: console decision logs. Routed to OTLP/Loki in observability hardening.
    decision_logs:
      console: true

    metrics_export:
      type: otlp/http
      address: opentelemetry-collector.observability.svc.cluster.local:4318
      export_interval_ms: 10000
      service_name: opa

    distributed_tracing:
      type: grpc
      address: opentelemetry-collector.observability.svc.cluster.local:4317
      service_name: opa
