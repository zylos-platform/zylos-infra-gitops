apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zylos-netpol-baseline-cluster
  namespace: kyverno
spec:
  rules:
    # Default Deny All Traffic
    - name: default-deny
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchExpressions:
                  - key: zylos.app/namespace-tier
                    operator: In
                    values:
                      - data
                      - tenant
                      - edge
                      - core
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: zylos-default-deny
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress

    # DNS Resolution
    - name: allow-dns
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchExpressions:
                  - key: zylos.app/namespace-tier
                    operator: In
                    values:
                      - data
                      - tenant
                      - edge
                      - core
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: zylos-allow-dns
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                    podSelector:
                      matchLabels:
                        k8s-app: kube-dns
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53

    # Istio Ambient Mesh
    - name: allow-istio-hbone
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchExpressions:
                  - key: zylos.app/namespace-tier
                    operator: In
                    values:
                      - data
                      - tenant
                      - edge
                      - core
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: zylos-allow-istio-hbone
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - ports:
                  - protocol: TCP
                    port: 15008

    # OTel Telemetry Push
    - name: allow-observability-push
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchExpressions:
                  - key: zylos.app/namespace-tier
                    operator: In
                    values:
                      - data
                      - tenant
                      - edge
                      - core
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: zylos-allow-observability-push
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: observability
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: opentelemetry-collector
                ports:
                  - protocol: TCP
                    port: 4317 # OTLP gRPC
                  - protocol: TCP
                    port: 4318 # OTLP HTTP

    # Kubelet Node Probes
    - name: allow-node-probes
      match:
        any:
          - resources:
            kinds:
              - Namespace
            selector:
              matchExpressions:
                - key: zylos.app/namespace-tier
                  operator: In
                  values:
                    - data
                    - tenant
                    - edge
                    - core
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: zylos-allow-node-probes
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - ports:
                  - protocol: TCP
                    port: 8080
                  - protocol: TCP
                    port: 8443
