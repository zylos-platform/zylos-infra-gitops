apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: zylos-netpol-prometheus
      namespace: observability
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 10.12.0.0/16
          ports:
            - protocol: TCP
              port: 9100
            - protocol: TCP
              port: 10250
