apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-products-bootstrap-job
  namespace: zylos-data-opensearch
  labels:
    app.kubernetes.io/name: catalog-opensearch
    app.kubernetes.io/part-of: zylos-platform
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-opensearch
        app.kubernetes.io/part-of: zylos-platform
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: catalog-opensearch-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: curlimages/curl:8.11.0
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
              ephemeral-storage: "100Mi"
          env:
            - name: OPENSEARCH_URL
              value: "http://opensearch:9200"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-admin-credentials
                  key: password
            - name: CATALOG_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-opensearch-app-user
                  key: password
          volumeMounts:
            - name: bootstrap-volume
              mountPath: /bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: bootstrap-volume
          configMap:
            name: catalog-products-bootstrap-config
