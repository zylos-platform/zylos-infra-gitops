apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: zylos-infra-kafka
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/part-of: zylos-platform
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/part-of: zylos-platform
        app.kubernetes.io/component: registry
    spec:
      enableServiceLinks: false
      serviceAccountName: schema-registry
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:8.0.0
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://zylos-kafka-kafka-bootstrap:9092"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: "backward"
            - name: SCHEMA_REGISTRY_HEAP_OPTS
              value: "-Xms128m -Xmx256m"
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /subjects
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /subjects
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /subjects
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 250m
              memory: 384Mi
              ephemeral-storage: 250Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
